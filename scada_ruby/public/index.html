<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini SCADA - Tablero Escuela</title>
    <!-- Librería Chart.js para dibujar la onda en tiempo real -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #1e1e2e; --panel: #282a36; --text: #f8f8f2; --accent: #50fa7b; --danger: #ff5555; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .dashboard { max-width: 800px; margin: auto; }
        h1 { text-align: center; color: var(--accent); letter-spacing: 2px; }
        .panel { background-color: var(--panel); padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; }
        
        /* Estilos del Botón Industrial */
        .btn { font-size: 20px; padding: 15px 40px; border: none; border-radius: 8px; cursor: pointer; color: white; transition: 0.2s; font-weight: bold; width: 80%; max-width: 400px; text-transform: uppercase; box-shadow: 0 4px 0 rgba(0,0,0,0.3); }
        .btn-off { background-color: var(--danger); }
        .btn-on { background-color: var(--accent); color: #000; box-shadow: 0 4px 0 #2e8b44; }
        .btn:active { transform: translateY(4px); box-shadow: 0 0 0 transparent; }
        
        canvas { max-width: 100%; height: 250px; margin-top: 20px; }
        .metrics { display: flex; justify-content: space-around; margin-top: 15px; font-size: 22px; background: #191a21; padding: 15px; border-radius: 8px; }
        .metric-value { font-weight: bold; color: var(--accent); text-shadow: 0 0 5px rgba(80,250,123,0.5); font-family: monospace; }
        .status-badge { font-size: 12px; background: #44475a; padding: 5px 10px; border-radius: 20px; vertical-align: middle; margin-left: 10px; }
    </style>
</head>
<body>
    <div class="dashboard">
        <h1>⚡ SCADA HMI <span class="status-badge" id="netStatus">Conectando...</span></h1>
        
        <div class="panel">
            <h2>Control de Turbina (Q1.2)</h2>
            <button id="toggleBtn" class="btn btn-off" onclick="toggleQ1()">Cargando PLC...</button>
        </div>

        <div class="panel">
            <h2>Telemetría de Red y Flujo</h2>
            <div class="metrics">
                <div>RPM: <span id="rpmValue" class="metric-value">0</span></div>
                <div>Voltaje: <span id="voltValue" class="metric-value">0.0 V</span></div>
            </div>
            <canvas id="scadaChart"></canvas>
        </div>
    </div>

    <script>
        // Configurar gráfico de onda sinusoidal
        const ctx = document.getElementById('scadaChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: { 
                labels: [], 
                datasets: [{ 
                    label: 'Amplitud de Turbina (Simulada)', 
                    borderColor: '#50fa7b', 
                    backgroundColor: 'rgba(80, 250, 123, 0.1)', 
                    borderWidth: 2,
                    data: [], 
                    tension: 0.4, 
                    fill: true,
                    pointRadius: 0
                }] 
            },
            options: { 
                responsive: true, 
                maintainAspectRatio: false,
                scales: { 
                    x: { display: false }, 
                    y: { min: -150, max: 150, grid: { color: '#44475a' } } 
                }, 
                animation: false 
            }
        });

        // Bucle de lectura (Polling al Backend Ruby cada 500ms)
        setInterval(async () => {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                
                document.getElementById('netStatus').innerText = "✅ En Línea";
                document.getElementById('netStatus').style.color = "#50fa7b";

                // Actualizar Botón
                const btn = document.getElementById('toggleBtn');
                if (data.q1_status) {
                    btn.className = 'btn btn-on'; 
                    btn.innerText = '⏹ DETENER TURBINA (ON)';
                } else {
                    btn.className = 'btn btn-off'; 
                    btn.innerText = '▶ ARRANCAR TURBINA (OFF)';
                }

                // Actualizar Textos
                document.getElementById('rpmValue').innerText = data.turbine_rpm;
                document.getElementById('voltValue').innerText = data.voltage + ' V';

                // Actualizar Gráfico (onda sinusoidal para simular generación)
                if (chart.data.labels.length > 40) { 
                    chart.data.labels.shift(); 
                    chart.data.datasets[0].data.shift(); 
                }
                chart.data.labels.push(data.timestamp);
                
                // La onda tiene amplitud si Q1 está encendido, si no es 0
                const fakeWave = data.q1_status ? (Math.sin(Date.now() / 200) * 120) : 0;
                chart.data.datasets[0].data.push(fakeWave);
                
                chart.update();
            } catch (e) {
                console.error("Error conectando", e);
                document.getElementById('netStatus').innerText = "❌ Desconectado";
                document.getElementById('netStatus').style.color = "#ff5555";
            }
        }, 2000); // 2 segundos es el estándar SCADA. 500ms quema el CPU del celular.

        // Enviar comando POST al servidor Ruby cuando se presiona el botón
        async function toggleQ1() {
            await fetch('/api/toggle', { method: 'POST' });
        }
    </script>
</body>
</html>
