<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini SCADA - Tablero Escuela</title>
    <!-- Librería jsPDF para exportar reportes -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --bg: #1e1e2e; --panel: #282a36; --text: #f8f8f2; --accent: #50fa7b; --danger: #ff5555; --info: #8be9fd; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .dashboard { max-width: 800px; margin: auto; }
        h1 { text-align: center; color: var(--accent); letter-spacing: 2px; }
        .panel { background-color: var(--panel); padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; }
        
        .btn { font-size: 20px; padding: 15px 40px; border: none; border-radius: 8px; cursor: pointer; color: white; transition: 0.2s; font-weight: bold; width: 80%; max-width: 400px; text-transform: uppercase; box-shadow: 0 4px 0 rgba(0,0,0,0.3); margin: 5px; }
        .btn-off { background-color: var(--danger); }
        .btn-on { background-color: var(--accent); color: #000; box-shadow: 0 4px 0 #2e8b44; }
        .btn-pdf { background-color: var(--info); color: #000; box-shadow: 0 4px 0 #5e9eb5; font-size: 16px; padding: 10px 20px; width: auto; }
        .btn:active { transform: translateY(4px); box-shadow: 0 0 0 transparent; }
        
        .metrics { display: flex; justify-content: space-around; margin-top: 15px; font-size: 22px; background: #191a21; padding: 15px; border-radius: 8px; }
        .metric-value { font-weight: bold; color: var(--accent); text-shadow: 0 0 5px rgba(80,250,123,0.5); font-family: monospace; }
        .status-badge { font-size: 12px; background: #44475a; padding: 5px 10px; border-radius: 20px; vertical-align: middle; margin-left: 10px; }
        
        .chart-container { position: relative; height: 250px; width: 100%; margin-top: 20px; background: #191a21; border-radius: 8px; overflow: hidden; border: 1px solid #44475a; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }
        canvas { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="dashboard">
        <h1>⚡ SCADA HMI <span class="status-badge" id="netStatus">Conectando...</span></h1>
        
        <div class="panel">
            <h2>Control de Turbina (Q1.2)</h2>
            <button id="toggleBtn" class="btn btn-off" onclick="toggleQ1()">Cargando PLC...</button>
        </div>

        <div class="panel">
            <h2>Telemetría de Red y Flujo</h2>
            <div class="metrics">
                <div>RPM: <span id="rpmValue" class="metric-value">0</span></div>
                <div>Voltaje: <span id="voltValue" class="metric-value">0.0 V</span></div>
            </div>
            <div class="chart-container">
                <canvas id="scadaChart"></canvas>
            </div>
            <div style="margin-top: 20px; text-align: right;">
                <button class="btn btn-pdf" onclick="generatePDF()">📄 Exportar Auditoría PDF</button>
            </div>
        </div>
    </div>

    <script>
        // ESTADO GLOBAL
        let isTurbineOn = false;

        // Bucle de lectura (Polling al Backend Ruby cada 1 segundo)
        // Solo para actualizar números y estado, NO para animar
        setInterval(async () => {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                
                document.getElementById('netStatus').innerText = "✅ En Línea";
                document.getElementById('netStatus').style.color = "#50fa7b";

                // Actualizar estado global para la animación
                isTurbineOn = data.q1_status;

                // Actualizar Botón
                const btn = document.getElementById('toggleBtn');
                if (isTurbineOn) {
                    btn.className = 'btn btn-on'; 
                    btn.innerText = '⏹ DETENER TURBINA (ON)';
                } else {
                    btn.className = 'btn btn-off'; 
                    btn.innerText = '▶ ARRANCAR TURBINA (OFF)';
                }

                // Actualizar Textos
                document.getElementById('rpmValue').innerText = data.turbine_rpm;
                document.getElementById('voltValue').innerText = data.voltage + ' V';
            } catch (e) {
                console.error("Error conectando", e);
                document.getElementById('netStatus').innerText = "❌ Desconectado";
                document.getElementById('netStatus').style.color = "#ff5555";
            }
        }, 1000);

        // OSCILOSCOPIO 60FPS (Aceleración por GPU)
        const canvas = document.getElementById('scadaChart');
        const ctx = canvas.getContext('2d');
        
        // Ajustar resolución del canvas
        function resizeCanvas() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let time = 0;
        let currentAmplitude = 0;

        function drawWave() {
            requestAnimationFrame(drawWave);
            
            // Limpiar con efecto de rastro (fade)
            ctx.fillStyle = 'rgba(25, 26, 33, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Suavizar la transición de la amplitud
            const targetAmplitude = isTurbineOn ? (canvas.height / 3) : 0;
            currentAmplitude += (targetAmplitude - currentAmplitude) * 0.1;

            ctx.beginPath();
            ctx.strokeStyle = '#50fa7b';
            ctx.lineWidth = 3;
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#50fa7b';

            for (let x = 0; x < canvas.width; x++) {
                // Ecuación de la onda: y = A * sin(kx - wt)
                const y = (canvas.height / 2) + Math.sin((x * 0.05) - time) * currentAmplitude;
                if (x === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();

            // Dibujar línea central (Tierra)
            ctx.beginPath();
            ctx.strokeStyle = 'rgba(80, 250, 123, 0.2)';
            ctx.lineWidth = 1;
            ctx.shadowBlur = 0;
            ctx.moveTo(0, canvas.height / 2);
            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.stroke();

            time += 0.15; // Velocidad de desplazamiento
        }
        
        // Iniciar animación
        drawWave();

        // Enviar comando POST al servidor Ruby
        async function toggleQ1() {
            // Animación inmediata en el frontend (optimistic UI)
            isTurbineOn = !isTurbineOn; 
            await fetch('/api/toggle', { method: 'POST' });
        }

        // Generar Reporte de Rendimiento en PDF con normativas
        function generatePDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            const currentRPM = document.getElementById('rpmValue').innerText;
            const currentVolt = document.getElementById('voltValue').innerText;
            const date = new Date().toLocaleString('es-CL');

            doc.setFontSize(18);
            doc.text("Auditoría de Rendimiento SCADA - Tablero Escuela", 15, 20);
            
            doc.setFontSize(12);
            doc.text(`Fecha y Hora de Muestra: ${date}`, 15, 30);
            doc.text(`Estado de Turbina F50: ${isTurbineOn ? 'EN OPERACIÓN (Flujo Abierto)' : 'DETENIDA'}`, 15, 40);
            doc.text(`Velocidad del Generador: ${currentRPM} RPM`, 15, 50);
            doc.text(`Voltaje de Inyección DC: ${currentVolt}`, 15, 60);

            doc.setFontSize(14);
            doc.text("1. Análisis Normativo Nacional (Chile - SEC)", 15, 80);
            doc.setFontSize(10);
            const textChile = "Según el Pliego Técnico Normativo RIC N°9 ('Sistemas de Autogeneración') de la Superintendencia de Electricidad y Combustibles (SEC), los sistemas aislados en extra baja tensión (SELV) que operan en rangos de 12V a 24V DC no requieren medidas de protección contra contactos directos adicionales a la aislación básica. El voltaje actual de " + currentVolt + " se encuentra dentro de los márgenes de seguridad absolutos para el Tablero Escuela. Al inyectarse a un inversor híbrido mediante un regulador de carga, cumple con las normas de asilamiento galvánico estipuladas para instalaciones didácticas.";
            doc.text(doc.splitTextToSize(textChile, 180), 15, 90);

            doc.setFontSize(14);
            doc.text("2. Análisis Normativo Internacional (IEC)", 15, 125);
            doc.setFontSize(10);
            const textInt = "De acuerdo al estándar IEC 61116 ('Guía de equipamiento electromecánico para pequeñas instalaciones hidroeléctricas'), las microturbinas deben operar dentro de un rango de RPM estable para evitar el fenómeno de cavitación y desgaste acelerado de los rodamientos. El valor actual de " + currentRPM + " RPM demuestra una correcta calibración de la electroválvula de 12V conectada a la salida Q1.2 del PLC LOGO!, manteniendo un caudal de agua nominal y regulado que prolonga la vida útil del equipo.";
            doc.text(doc.splitTextToSize(textInt, 180), 15, 135);

            // Pie de página
            doc.setFontSize(10);
            doc.setTextColor(100);
            doc.text("Generado automáticamente por el SCADA HMI Edge Server.", 15, 280);

            // Descargar
            doc.save(`Reporte_SCADA_${new Date().getTime()}.pdf`);
        }
    </script>
</body>
</html>
